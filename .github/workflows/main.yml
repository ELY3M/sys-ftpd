name: Build

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:
  workflow_call:
  
jobs:
  build:
    name: Test build
    runs-on: ubuntu-latest
    container:
      image: 'devkitpro/devkita64'
      ##image: 'ghcr.io/ely3m/devkita64'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: build
        run: make -j$(nproc)
        
      - name: test
        run: |
          pwd
          ls -la 
          ls -la out
        
      - name: Zipping up Release folder
        run: zip -r release.zip out

      - name: get date/date 
        env:
          TZ: "America/Chicago"
        run: | 
          echo "NOW=$(date +'%m-%d-%Y-%I.%M.%S.%p')" >> $GITHUB_ENV
        
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NOW }}
          prerelease: false
          draft: false
          body: ${{ github.event.head_commit.message }}
          files: release.zip
          name: "Switch Release ${{ env.NOW }}"